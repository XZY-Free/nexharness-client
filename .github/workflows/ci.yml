name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # electron 二进制仅桌面打包需要（本地按需下载）；CI 只做构建链验证，跳过下载加速。
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # 注：pnpm test 已内置测试收集完整性校验（vitest 在高负载下会静默少收集
      # 测试文件且退出码 0 → 假绿）。单独校验可随时跑 `pnpm test:collect-check`。
      - run: pnpm build
      # 桌面构建链验证：renderer 构建 + 主进程/预加载类型检查（完整 electron-builder 打包本地/发布时跑）。
      - run: pnpm build:desktop-renderer
      - run: pnpm exec tsc -p desktop/tsconfig.json --noEmit
