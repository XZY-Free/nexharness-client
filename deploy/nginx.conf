# nexharness-client SPA — nginx 服务配置（子路径 /nexharness/ 形态）
#
# 与构建期 NEX_BASE_PATH=/nexharness/ 配套：产物目录挂载在 /usr/share/nginx/html/nexharness/。
# 根路径部署改法：NEX_BASE_PATH=/ 构建 + 把 location 前缀 /nexharness/ 改为 /、
# 产物目录挂到 /usr/share/nginx/html/。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 构建资产（内容哈希命名）：长缓存
    location /nexharness/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口与客户端路由 fallback
    location /nexharness/ {
        try_files $uri $uri/ /nexharness/index.html;
    }

    # 无斜杠访问跳转
    location = /nexharness {
        return 301 /nexharness/;
    }

    # 探活（供 K8s probes / 负载均衡）
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # （可选）同域反代 API——按部署拓扑启用，可省去 CORS 配置：
    # SPA 代码内 API 基址由运行期注入（runtime-config），使用相对路径时走此代理。
    # location /nexharness/api/ {
    #     proxy_pass http://nexharness-api:3000/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location /nexharness/auth/ {
    #     proxy_pass http://auth-center:3100/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
