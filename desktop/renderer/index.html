<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      与 Web 侧（仓根 index.html）同一套 CSP 口径，差异仅在 connect-src：
      Desktop renderer 的 API/SSE 经本机 loopback server 同源代理，故仍为 'self'。
      worker-src blob: + wasm-unsafe-eval 为 shiki 的 oniguruma wasm 引擎所需。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    />
    <title>NexHarness Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
