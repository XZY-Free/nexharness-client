<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP 说明（构建产物由 Vite 打包，无 inline script / inline style）：
      - script-src 'self'：应用脚本与 theme-init.js 均为同源文件。
      - style-src 'self' 'unsafe-inline'：Tailwind 运行时与 shiki 高亮会注入行内样式。
      - img-src / font-src / connect-src：同源 + data:（favicon/内联图标）。
      - worker-src blob:：shiki 的 oniguruma engine 以 blob worker 加载 wasm。
      - wasm-unsafe-eval：shiki 编译 wasm 语法引擎所需。
      注意：改 CSP 前先确认 shiki / 主题注入不被拦截，否则代码高亮会静默降级为纯文本。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    />
    <title>NexHarness</title>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <script src="%BASE_URL%theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
